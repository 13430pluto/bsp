<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>승차 알림</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--sub:#5b6785;--line:#d9e0ee;--accent:#0b5fff;--ok:#0a8f4e;--warn:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--ink:#f1f5ff;--sub:#9aa7c7;--line:#2a3558;--accent:#5b8cff;--ok:#3ddc84;--warn:#ffa366}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--ink:#f1f5ff;--sub:#9aa7c7;--line:#2a3558;--accent:#5b8cff;--ok:#3ddc84;--warn:#ffa366}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:8px 0 2px}
.sub{color:var(--sub);margin:0 0 18px;font-size:15px}
.stop{background:var(--accent);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:16px}
.stop b{font-size:19px}
.stop small{display:block;opacity:.85}
.bus{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:72px}
.bus:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bus .no{font-size:30px;font-weight:800}
.bus .eta{font-size:17px;font-weight:700;color:var(--ok)}
.bus .eta.far{color:var(--sub)}
.bus.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.bus .l{display:flex;flex-direction:column}
.bus .l small{color:var(--sub);font-size:13px}
#go{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-size:19px;font-weight:700;padding:18px;margin-top:8px;cursor:pointer}
#go:disabled{opacity:.4;cursor:not-allowed}
#msg{margin-top:14px;padding:14px;border-radius:12px;font-weight:600;display:none}
#msg.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ok)}
#msg.err{display:block;background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--warn)}
#cancel{display:none;width:100%;margin-top:10px;background:none;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:14px;font:inherit;cursor:pointer}
.note{font-size:12px;color:var(--sub);margin-top:22px}
#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:10}
#dlg .box{background:var(--card);border-radius:18px;padding:26px 20px 20px;width:100%;max-width:380px;text-align:center}
#dlg .q{font-size:22px;font-weight:700;margin:0 0 22px;line-height:1.4}
#dlg .q b{color:var(--accent);font-size:30px}
#dlg .row{display:flex;gap:10px}
#dlg button{flex:1;border-radius:14px;padding:16px;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
#yes{background:var(--accent);color:#fff;border:0}
#no{background:none;color:var(--ink);border:2px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>승차 알림</h1>
  <p class="sub">탈 버스를 선택하면 정류장 전광판에 번호가 표시돼요.</p>

  <div class="stop"><b id="stopName">정류장 확인 중…</b><small id="stopId"></small></div>
  <div id="list" role="list" aria-live="polite"></div>

  <button id="go" hidden disabled>요청</button>
  <div id="dlg" role="dialog" aria-modal="true">
    <div class="box">
      <p class="q">진짜 <b id="dlgNo"></b><br>버스를 타시겠습니까?</p>
      <div class="row"><button id="no">아니오</button><button id="yes">예</button></div>
    </div>
  </div>
  <button id="cancel">요청 취소</button>
  <div id="msg" role="status"></div>
  <p class="note" id="mode"></p>
</main>

<script>
/* ===== 설정 =====
   API_BASE 를 실제 서버 주소로 바꾸세요. 비워두면 데모 모드(가짜 데이터)로 동작합니다.
   QR 코드에는 이런 주소를 넣으세요: https://내도메인/?station=12345
*/
const API_BASE = "";            // 예: "https://api.example.com"
const MAX_DISTANCE_M = 80;      // 정류장 반경(미터). 위치 확인 사용 시
const USE_GPS_CHECK = false;    // true 로 바꾸면 정류장 근처에서만 요청 가능

const params = new URLSearchParams(location.search);
const stationId = params.get("station") || "DEMO-001";
const $ = id => document.getElementById(id);
let selected = null, requestId = null, stationInfo = null;

/* 데모 데이터 */
const DEMO = {
  station:{id:stationId,name:"신도림 중학교",lat:37.5663,lng:126.9779},
  buses:[{no:"5615",eta:2},{no:"6633",eta:5},{no:"양천03",eta:9}]
};

async function api(path, opts){
  if(!API_BASE){ // 데모 모드
    await new Promise(r=>setTimeout(r,300));
    if(path.startsWith("/stations/")) return DEMO;
    return {ok:true,requestId:"demo-"+Date.now()};
  }
  const res = await fetch(API_BASE+path, {headers:{"Content-Type":"application/json"},...opts});
  if(!res.ok) throw new Error("서버 오류 "+res.status);
  return res.json();
}

function render(buses){
  const list = $("list"); list.innerHTML = "";
  buses.forEach(b=>{
    const btn = document.createElement("button");
    btn.className = "bus"+(selected===b.no?" sel":"");
    btn.setAttribute("role","listitem");
    btn.innerHTML = `<span class="l"><span class="no">${b.no}번</span></span>
      <span class="eta ${b.eta>10?"far":""}">${b.eta<=1?"곧 도착":b.eta+"분 후"}</span>`;
    btn.onclick = ()=>{ if(requestId) return; selected=b.no; render(buses); $("dlgNo").textContent=b.no+"번"; $("dlg").style.display="flex"; };
    list.appendChild(btn);
  });
}

async function load(){
  try{
    const data = await api("/stations/"+encodeURIComponent(stationId));
    stationInfo = data.station;
    $("stopName").textContent = data.station.name;
    $("stopId").textContent = "정류장 번호 "+data.station.id;
    render(data.buses);
    window._buses = data.buses;
    $("mode").textContent = API_BASE ? "" : "※ 데모 모드: 실제 서버에 연결되지 않았어요.";
  }catch(e){ show("err","버스 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요."); }
}

function show(type,text){ const m=$("msg"); m.className=type; m.textContent=text; }

function getPosition(){
  return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:8000}));
}
function distM(a,b,c,d){ // 하버사인
  const R=6371000,t=x=>x*Math.PI/180,dLat=t(c-a),dLng=t(d-b);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

$("go").onclick = async ()=>{
  if(!selected) return;
  $("go").disabled = true;
  try{
    let pos = null;
    if(USE_GPS_CHECK){
      const p = await getPosition();
      const d = distM(p.coords.latitude,p.coords.longitude,stationInfo.lat,stationInfo.lng);
      if(d>MAX_DISTANCE_M){ show("err","정류장 근처에서만 요청할 수 있어요."); $("go").disabled=false; return; }
      pos = {lat:p.coords.latitude,lng:p.coords.longitude};
    }
    const r = await api("/requests",{method:"POST",body:JSON.stringify({stationId,busNo:selected,pos})});
    requestId = r.requestId;
    show("ok",`${selected}번 버스 요청 완료! 전광판에 표시됩니다.`);
    $("cancel").style.display="block";
    if(navigator.vibrate) navigator.vibrate(120);
  }catch(e){
    show("err", USE_GPS_CHECK ? "위치를 확인하지 못했어요. 위치 권한을 허용해 주세요." : "요청에 실패했어요. 다시 시도해 주세요.");
    $("go").disabled=false;
  }
};

$("cancel").onclick = async ()=>{
  try{ await api("/requests/"+requestId,{method:"DELETE"}); }catch(e){}
  requestId=null; selected=null; $("go").disabled=true; $("cancel").style.display="none";
  show("ok","요청을 취소했어요."); render(window._buses||[]);
};

$("yes").onclick = ()=>{ $("dlg").style.display="none"; $("go").disabled=false; $("go").click(); };
$("no").onclick = ()=>{ $("dlg").style.display="none"; selected=null; render(window._buses||[]); };

load();
</script>
</body>
</html>
